<!DOCTYPE html>
<html>
<head>
  <title>Nested Tables</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    table {
      width: 100%;
    }
  </style>
</head>
<body>

<table border="1" style="width: 100%; border: 1px solid black;">
  <tr>
    <!-- Top Left - Nested Table 2 -->
    <td>
      <table border="1" style="width: 100%;">
        <tr>
          <th colspan="2">Nested Table 2</th>
        </tr>
        <tr>
          <th>Column 1</th>
          <th>Column 2</th>
        </tr>
        <tr>
          <td>abc</td>
          <td>def</td>
        </tr>
      </table>
    </td>

    <!-- Top Right - Nested Table 1 -->
    <td>
      <table border="1" style="width: 100%;">
        <tr>
          <th>Nested Table 1</th>
        </tr>
        <tr>
          <td>
            <ul>
              <li>List item</li>
              <li>List item</li>
              <li>List item</li>
            </ul>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <!-- Bottom Left - Nested Table 3 -->
    <td>
      <table border="1" style="width: 100%;">
        <tr>
          <th colspan="2">Nested Table 3</th>
        </tr>
        <tr>
          <td><a href="">Nested Table</a></td>
          <td>Demo Continued</td>
        </tr>
      </table>
    </td>

    <!-- Bottom Right - Nested Table 4 -->
    <td>
      <table border="1" style="width: 100%;">
        <tr>
          <th>Nested Table 4</th>
        </tr>
        <tr>
          <td style="background-color: black; color: white; text-align: center;">HTML</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
